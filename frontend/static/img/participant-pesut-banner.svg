<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" fill="none">
  <defs>
    <linearGradient id="pesutBody" x1="710" y1="43" x2="872" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#536B73"/><stop offset=".32" stop-color="#84999B"/><stop offset=".68" stop-color="#B9C8C2"/><stop offset="1" stop-color="#71878B"/>
    </linearGradient>
    <linearGradient id="pesutBelly" x1="724" y1="117" x2="810" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2EAD9"/><stop offset="1" stop-color="#C7D1CC"/>
    </linearGradient>
    <linearGradient id="pesutFin" x1="850" y1="92" x2="882" y2="177" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8C9C5"/><stop offset=".55" stop-color="#899FA0"/><stop offset="1" stop-color="#667D82"/>
    </linearGradient>
    <linearGradient id="crownGold" x1="735" y1="10" x2="794" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE58A"/><stop offset=".45" stop-color="#E9B63D"/><stop offset="1" stop-color="#B9791F"/>
    </linearGradient>
    <radialGradient id="pesutGlow" cx="0" cy="0" r="1" gradientTransform="matrix(84 91 -82 76 743 65)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2FAF5" stop-opacity=".72"/><stop offset="1" stop-color="#F2FAF5" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="654" y="18" width="291" height="239" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Warm decorative waves to blend with the existing dashboard banner. -->
  <path d="M535 230c36-40 72-63 117-75 48-13 79-39 103-78 20-32 55-44 81-22 23 20 17 47-5 75-21 27-25 50-9 70 9 12 25 22 47 30H535Z" fill="#D7BD82" opacity=".20"/>
  <path d="M640 230c31-29 66-45 109-50 43-5 69-22 92-51 20-25 47-31 67-15 18 14 15 37-3 58-14 17-13 36 6 58H640Z" fill="#E6D1A4" opacity=".43"/>
  <circle cx="897" cy="49" r="25" fill="#E6D09F" opacity=".5"/>
  <circle cx="690" cy="107" r="16" fill="#D8C18D" opacity=".26"/>
  <path d="m640 151 17-18m22 1 12-15m186-72 9-13m53 68 13-7" stroke="#D6B66C" stroke-linecap="round" stroke-width="3" opacity=".5"/>
  <circle cx="707" cy="44" r="4" fill="#D6B66D"/><circle cx="923" cy="98" r="4" fill="#fff"/>
  <path d="M704 217c35-22 72-32 111-30 39 2 74 16 105 43H704Z" fill="#F5E6C5" opacity=".27"/>

  <!-- Soft shadow behind the mascot. -->
  <ellipse cx="808" cy="218" rx="109" ry="17" fill="#8A7653" opacity=".19" filter="url(#softShadow)"/>

  <!-- Tail and body. The rounded head and short muzzle are characteristic of a pesut. -->
  <path d="M765 193c-19 2-37-8-55-22 3 20 15 34 35 39-14 5-23 13-29 23 24-1 45-10 65-26l-16-14Z" fill="url(#pesutBody)"/>
  <path d="M758 230c5-35 22-60 49-77 17-11 38-14 55-4 29 17 47 44 57 81H758Z" fill="url(#pesutBody)"/>
  <path d="M778 230c7-28 20-48 39-64 18 11 34 14 52 11 16 11 28 29 36 53H778Z" fill="url(#pesutBelly)" opacity=".96"/>
  <path d="M832 166c17-27 24-46 39-57 4 23-4 43-21 60" fill="#607780"/>
  <path d="M831 165c17-25 26-38 39-46" stroke="#B9C8C4" stroke-linecap="round" stroke-width="3" opacity=".55"/>

  <!-- Raised pectoral fin, posed like a friendly wave. -->
  <path d="M842 169c13-13 20-31 26-52 4-14 10-25 19-29 7-3 14 1 14 8 0 6-4 13-8 20 8-6 16-5 19 1 3 6-1 12-7 19 8-2 13 2 12 8-1 7-9 15-18 21-13 9-27 17-43 22l-14-18Z" fill="url(#pesutFin)" stroke="#647A80" stroke-width="1.8"/>
  <path d="M877 105c-3 13-7 25-12 37m27-18c-6 11-13 20-22 28" stroke="#DCE5DE" stroke-linecap="round" stroke-width="2.5" opacity=".62"/>
  <path d="M900 90c5 3 7 8 5 13" stroke="#E6EFEB" stroke-linecap="round" stroke-width="2" opacity=".7"/>

  <!-- Rounded forehead and short, blunt muzzle. -->
  <path d="M704 91c1-31 21-54 52-61 34-8 70 7 86 35 17 29 9 64-16 83-17 14-39 19-61 13-17-4-30-14-39-28-13 1-27-3-38-11-11-8-15-18-10-26 5-8 15-10 26-5Z" fill="url(#pesutBody)" stroke="#647A80" stroke-width="2"/>
  <path d="M710 101c-12-5-22-4-29 2-5 5-2 12 6 17 10 6 22 8 34 6-6-7-10-16-11-25Z" fill="url(#pesutBelly)"/>
  <path d="M716 70c13-17 33-27 55-27 28 0 51 14 63 36-15-13-34-19-54-17-23 2-43 12-56 29-6 8-10 17-12 27-4-17-2-34 4-48Z" fill="url(#pesutGlow)"/>

  <!-- Friendly eye and a small curved smile. -->
  <ellipse cx="727" cy="91" rx="7" ry="9" fill="#F4F3EA"/>
  <ellipse cx="729" cy="92" rx="4" ry="6" fill="#24333A"/>
  <circle cx="730" cy="90" r="1.8" fill="#fff"/>
  <path d="M684 112c12 8 26 10 40 7" stroke="#52686E" stroke-linecap="round" stroke-width="3.5"/>
  <path d="M686 114c9 3 18 4 27 3" stroke="#F5E9D8" stroke-linecap="round" stroke-width="1.5" opacity=".85"/>
  <ellipse cx="718" cy="105" rx="7" ry="4" fill="#D68D7A" opacity=".36"/>
  <path d="M749 133c15 9 31 12 47 10" stroke="#E8F0E9" stroke-linecap="round" stroke-width="3" opacity=".72"/>

  <!-- Gold crown with rounded tips and a jewel. -->
  <g transform="translate(152 -2) scale(.82 .82)">
    <path d="m719 53 5-34 22 22 20-34 19 34 23-22 3 35c-28 9-62 9-92-1Z" fill="url(#crownGold)" stroke="#A96E1A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M721 52c27 8 59 8 88 0l2 12c-31 10-62 10-91 0l1-12Z" fill="#D99A2B" stroke="#A96E1A" stroke-width="2"/>
    <circle cx="724" cy="17" r="4.5" fill="#FFE9A0"/><circle cx="766" cy="8" r="4.5" fill="#FFE9A0"/><circle cx="808" cy="18" r="4.5" fill="#FFE9A0"/>
    <path d="m765 48 6 7 7-7-7-7-6 7Z" fill="#EAF7F4" stroke="#A96E1A" stroke-width="1.5"/>
    <path d="M738 57v6m23-4v7m24-8v6" stroke="#FFF0B8" stroke-linecap="round" stroke-width="2" opacity=".8"/>
  </g>

  <!-- Little glints around the greeting pose. -->
  <path d="m668 75 4 8 9 1-7 6 2 9-8-5-7 5 1-9-6-6 9-1 3-8Zm248-18 4 7 8 1-6 5 2 8-8-4-6 4 1-8-6-5 8-1 3-7Z" fill="#F3D27D" opacity=".82"/>
  <circle cx="661" cy="119" r="3" fill="#fff"/><circle cx="934" cy="135" r="3" fill="#fff"/>
</svg>
