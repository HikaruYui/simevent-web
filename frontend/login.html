<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | SIMEVENT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&family=Manrope:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-page">
        <!-- PANEL KIRI -->
        <section class="brand-panel" aria-label="SIMEVENT">
            
            <div class="brand-ribbon">
                <img src="assets/rope.jpg"
                alt=""
                aria-hidden="true">
            </div>

            <div class="brand-mark">
                <!-- Ganti logo.png dengan nama file logo lengkap milikmu. -->
                <img class="brand-logo" src="assets/logo.png" alt="SIMEVENT"
                     onerror="this.hidden = true; this.nextElementSibling.hidden = false;">
                <!-- <img src = "assets/rope.jpg"> -->
                <span class="brand-fallback" hidden>SIMEVENT</span>
            </div>
        </section>

        <!-- PANEL KANAN -->
        <section class="form-panel" aria-labelledby="login-title">
            <div class="login-content">
                <header class="login-heading">
                    <h1 id="login-title">Selamat Datang</h1>
                    <p>Silakan masuk ke akun Anda</p>
                </header>

                <form class="login-form" id="login-form" method="post">
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email"
                               placeholder="Masukkan Email Anda"
                               autocomplete="username" required>
                    </div>

                    <div class="form-field">
                        <label for="password">Kata Sandi</label>
                        <input type="password" id="password" name="password"
                               placeholder="Masukkan Kata Sandi Anda"
                               autocomplete="current-password" required>
                    </div>

                    <button class="continue-btn" type="submit">Continue</button>
                    <p class="form-message" id="form-message" role="status" hidden></p>
                </form>

                <!-- Sesuaikan href saat halaman pendaftaran dibuat. -->
                <p class="signup-text">Belum punya akun? <a href="Sign Up.html">Sign up</a></p>
            </div>
        </section>
    </main>

    <script>
        // Preview UI: data tidak dikirim atau disimpan.
        // Ganti handler ini dengan proses autentikasi saat backend tersedia.
        document.getElementById("login-form").addEventListener("submit", function (event) {
            event.preventDefault();
            const message = document.getElementById("form-message");
            message.textContent = "Form sudah terisi. Halaman ini belum terhubung ke sistem login.";
            message.hidden = false;
        });
    </script>
</body>
</html>
