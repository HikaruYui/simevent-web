    <main>
      
<section class="auth">
  <a class="auth__logo" href="landing_page.html" aria-label="SIMEVENT, ke beranda">
    <img src="static/img/logo.svg" alt="SIMEVENT">
  </a>

  <div class="auth__panel">
    <section id="loginPanel">
  <!-- Ubah inline style untuk font judul dan subjudul -->
  <h1 class="auth__title" style="font-family: 'League Spartan', sans-serif; font-size: 4.1rem; text-shadow: 0 0.5rem 0.5rem rgba(0, 0, 0, 0.25);">Selamat Datang</h1>
  <p class="auth__sub" style="font-family: 'Manrope', sans-serif; font-size: 1.3rem;">Silakan masuk ke akun Anda</p>
  
  <!-- Pesan Notifikasi (Penting untuk fungsionalitas JS bawaan) -->
  <p id="loginError" role="alert" hidden style="margin:0 0 12px;padding:10px 14px;border-radius:14px;background:#fbe9e7;border:1px solid #e4a59b;color:#8a2f22;font-size:.9rem;text-align:center"></p>
  <p id="loginNotice" role="status" hidden style="margin:0 0 12px;padding:10px 14px;border-radius:14px;background:#e7f1e6;border:1px solid #b8d0b3;color:#345a36;font-size:.9rem;text-align:center"></p>

  <!-- Tambahkan class "form" dan bungkus input dengan "campo" -->
  <form class="auth__form form" id="loginForm" novalidate>
    <div class="campo">
      <!-- Ingat: beri placeholder kosong " " agar efek CSS mengambang bekerja -->
      <input class="field" id="id_email" type="email" name="email" placeholder=" " autocomplete="email" required autofocus>
      <!-- Label diletakkan SETELAH input -->
      <label for="id_email">Masukkan Email</label>
    </div>

    <div class="campo">
      <input class="field" id="id_password" type="password" name="password" placeholder=" " autocomplete="current-password" required>
      <label for="id_password">Masukkan Kata Sandi</label>
    </div>

    <!-- Tambahkan Lupa Password -->
    <a class="forgot" href="#">Lupa Password?</a>

    <!-- Tombol Submit -->
    <button class="btn" type="submit">Continue</button>
  </form>

  <!-- Navigasi pindah ke form daftar -->
  <p class="switch">Belum punya akun? <a href="#daftar" id="showRegister">Daftar sekarang</a></p>

  <div class="atau" aria-hidden="true"><i></i>or<i></i></div>

  <button class="btn-google" type="button">
    <!-- SVG logo Google -->
    <svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Continue with Google
  </button>
</section>

    <section id="registerPanel" hidden>
  <h1 class="auth__title" style="font-family: 'League Spartan', sans-serif; font-size: 4.1rem; text-shadow: 0 0.5rem 0.5rem rgba(0, 0, 0, 0.25);">Selamat Datang</h1>
  <p class="auth__sub" style="font-family: 'Manrope', sans-serif; font-size: 1.3rem;">Buat akun untuk bergabung dengan SIMEVENT</p>
  <p id="registerError" role="alert" hidden style="margin:0 0 12px;padding:10px 14px;border-radius:14px;background:#fbe9e7;border:1px solid #e4a59b;color:#8a2f22;font-size:.9rem;text-align:center"></p>

  <form class="auth__form form" id="registerForm" novalidate>
    <div class="campo">
      <!-- Label "Nama lengkap" dan "Jenis akun" dihapus agar sesuai screenshot -->
      <input class="field" id="registerEmail" name="email" type="email" placeholder=" " autocomplete="email" required>
      <label for="registerEmail">Masukkan Email</label>
    </div>
    
    <div class="campo">
      <input class="field" id="registerPassword" name="password" type="password" placeholder=" " autocomplete="new-password" required minlength="8">
      <label for="registerPassword">Masukkan Kata Sandi</label>
    </div>
    
    <div class="campo">
      <input class="field" id="registerConfirm" name="confirm" type="password" placeholder=" " autocomplete="new-password" required minlength="8">
      <label for="registerConfirm">Konfirmasi Kata Sandi</label>
    </div>

    <!-- Dropdown role disembunyikan/dihapus sementara karena tidak ada di desain -->
    <!-- Jika masih dibutuhkan oleh JavaScript, Anda bisa membuatnya type="hidden" -->
    <input type="hidden" id="registerRole" name="role" value="Peserta">

    <button class="btn" type="submit">Continue</button>
  </form>

  <p class="switch">Sudah punya akun? <a href="#masuk" id="showLogin">Masuk sekarang</a></p>

  <div class="atau" aria-hidden="true"><i></i>or<i></i></div>

  <button class="btn-google" type="button">
    <!-- SVG logo Google -->
    <svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Continue with Google
  </button>
</section>

    </main>

    
  </div>

  

  <script>
    // ===== Login sederhana (prototipe, sisi klien) =====
    // Sesi disimpan di localStorage -> tetap login walau browser ditutup.
    var SESSION_KEY = 'simevent_session';
    var USERS_KEY = 'simevent_users';
    var requestedEvent = new URLSearchParams(location.search).get('event');
    var USERS = [
      { email: 'budi.panitia@simevent.com', password: 'admin123',
        name: 'Budi Santoso', role: 'Main Admin', redirect: 'panitia_page.html' },
      { email: 'peserta@simevent.com', password: 'peserta123',
        name: 'Peserta Event', role: 'Peserta', redirect: 'peserta_page.html' }
    ];

    function readUsers() {
      var raw = localStorage.getItem(USERS_KEY);
      if (!raw) return [];
      var users = JSON.parse(raw);
      if (!Array.isArray(users)) throw new Error('Data akun tidak valid.');
      return users;
    }

    function readSession() {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      } catch (e) {
        return null;
      }
    }

    function destination(user) {
      if (user.role === 'Peserta') {
        return 'peserta_page.html' + (requestedEvent ? '?event=' + encodeURIComponent(requestedEvent) : '');
      }
      return user.redirect;
    }

    function saveSession(user) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        email: user.email, name: user.name, role: user.role,
        redirect: user.redirect, loginAt: new Date().toISOString()
      }));
    }

    function showAuthPanel(panel) {
      document.getElementById('loginPanel').hidden = panel !== 'login';
      document.getElementById('registerPanel').hidden = panel !== 'register';
      document.getElementById('loginError').hidden = true;
      document.getElementById('loginNotice').hidden = true;
      document.getElementById('registerError').hidden = true;
      history.replaceState(null, '', panel === 'register' ? '#daftar' : '#masuk');
    }

    document.getElementById('showRegister').addEventListener('click', function (event) {
      event.preventDefault();
      showAuthPanel('register');
    });
    document.getElementById('showLogin').addEventListener('click', function (event) {
      event.preventDefault();
      showAuthPanel('login');
    });
    if (location.hash === '#daftar') showAuthPanel('register');
    var existingSession = readSession();
    if (existingSession && existingSession.email && existingSession.redirect) {
      location.replace(destination(existingSession));
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!e.currentTarget.reportValidity()) return;
      var email = document.getElementById('id_email').value.trim().toLowerCase();
      var pass  = document.getElementById('id_password').value;
      var err   = document.getElementById('loginError');
      var user;
      try {
        user = USERS.concat(readUsers()).find(function (u) { return u.email === email && u.password === pass; });
      } catch (storageError) {
        err.textContent = 'Data akun tidak bisa dibaca dari penyimpanan browser.';
        err.hidden = false;
        return;
      }

      if (!user) {
        err.textContent = 'Email atau kata sandi salah.';
        err.hidden = false;
        return;
      }
      try {
        saveSession(user);
      } catch (ex) {
        err.textContent = 'Login tidak bisa disimpan oleh browser. Izinkan penyimpanan lokal lalu coba lagi.';
        err.hidden = false;
        return;
      }
      location.href = destination(user);
    });

    document.getElementById('registerForm').addEventListener('submit', function (event) {
      event.preventDefault();
      var name = document.getElementById('registerName').value.trim();
      var email = document.getElementById('registerEmail').value.trim().toLowerCase();
      var role = document.getElementById('registerRole').value;
      var password = document.getElementById('registerPassword').value;
      var confirm = document.getElementById('registerConfirm').value;
      var error = document.getElementById('registerError');
      var form = event.currentTarget;

      if (!form.reportValidity()) return;
      if (password !== confirm) {
        error.textContent = 'Konfirmasi kata sandi belum sama.';
        error.hidden = false;
        return;
      }
      var redirects = { Peserta: 'peserta_page.html', Panitia: 'panitia_page.html' };
      if (!Object.prototype.hasOwnProperty.call(redirects, role)) {
        error.textContent = 'Pilih jenis akun Peserta atau Panitia.';
        error.hidden = false;
        return;
      }
      var user = { name: name, email: email, password: password, role: role, redirect: redirects[role] };
      try {
        var users = readUsers();
        if (USERS.concat(users).some(function (registeredUser) { return registeredUser.email === email; })) {
          error.textContent = 'Email ini sudah terdaftar. Silakan masuk.';
          error.hidden = false;
          return;
        }
        users.push(user);
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
      } catch (storageError) {
        error.textContent = 'Akun tidak bisa disimpan oleh browser. Izinkan penyimpanan lokal lalu coba lagi.';
        error.hidden = false;
        return;
      }
      if (role === 'Peserta') {
        document.getElementById('id_email').value = email;
        document.getElementById('id_password').value = '';
        form.reset();
        showAuthPanel('login');
        var notice = document.getElementById('loginNotice');
        notice.textContent = 'Akun berhasil dibuat. Silakan masuk dengan email dan kata sandi Anda.';
        notice.hidden = false;
        document.getElementById('id_password').focus();
        return;
      }
      try {
        saveSession(user);
      } catch (storageError) {
        error.textContent = 'Akun berhasil dibuat, tetapi sesi masuk tidak bisa disimpan. Silakan masuk dengan akun baru.';
        error.hidden = false;
        return;
      }
      location.href = destination(user);
    });
  </script>
