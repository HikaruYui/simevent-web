{% block content %}

<article class="card adm-card"><div class="toolbar"><label class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span class="sr-only">Cari</span><input id="auSearch" type="search" placeholder="Cari kegiatan atau pelaku"></label></div><div class="tabs adm-tabs" id="auTabs" role="group" aria-label="Filter jenis"></div>
