<div class="panel-card" style="padding: 28px;">
  <h3 style="margin:0 0 6px; font-size:20px; font-weight:800; color:var(--orange);">
    <i class="fa-solid fa-folder-open"></i> Manajemen Dokumentasi Event
  </h3>
  <p style="margin:0 0 24px; font-size:14px; color:var(--muted);">
    Unggah atau lihat foto-foto kegiatan (dokumentasi) peserta selama event berlangsung.
  </p>

  <div style="background:var(--cream-soft); padding:20px; border-radius:16px; border:1px solid var(--line);">
    <h4 style="margin:0 0 10px; font-size:16px; font-weight:800; color:var(--olive);">Tautan Folder Google Drive Dokumentasi</h4>
    <p style="margin:0 0 16px; font-size:13px; color:var(--muted);">Simpan tautan Google Drive yang dapat diakses panitia untuk mempermudah koordinasi dokumentasi.</p>
    
    <div style="display:flex; gap:10px;">
      <input type="url" id="gdriveLinkInput" placeholder="https://drive.google.com/drive/folders/..." style="flex:1; padding:12px 16px; border-radius:12px; border:1.5px solid var(--line); font-size:14px;" value="https://drive.google.com/">
      <button type="button" class="btn-primary" onclick="saveGDriveLink()">
        <i class="fa-solid fa-floppy-disk"></i> Simpan
      </button>
    </div>
  </div>

  <div style="margin-top:24px; text-align:center;">
    <a href="https://drive.google.com/" id="btnOpenDrive" target="_blank" class="btn-olive" style="font-size:16px; padding:16px 32px; border-radius:999px;">
      <i class="fa-brands fa-google-drive"></i> Buka Folder Dokumentasi
    </a>
  </div>
</div>

<script>
  function saveGDriveLink() {
    const link = document.getElementById('gdriveLinkInput').value;
    if(link) {
      localStorage.setItem('simevent_gdrive_link', link);
      document.getElementById('btnOpenDrive').href = link;
      alert('Tautan Google Drive berhasil disimpan!');
    }
  }
  document.addEventListener('DOMContentLoaded', () => {
    const savedLink = localStorage.getItem('simevent_gdrive_link');
    if(savedLink) {
      document.getElementById('gdriveLinkInput').value = savedLink;
      document.getElementById('btnOpenDrive').href = savedLink;
    }
  });
</script>
