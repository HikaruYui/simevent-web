{% extends "ketua_panitia/base_ketua_panitia.html" %}
{% block title %}Peserta{% endblock %}
{% block page_key %}peserta{% endblock %}
{% block nav_peserta %} class="is-active" aria-current="page"{% endblock %}
{% block content %}
<!-- Header dengan Jarak Bawah yang Longgar -->
<header class="eo-head" style="margin-bottom: 24px !important;">
  <h1>Peserta</h1>
</header>

<!-- CSS Custom Dropdown (100% Mengunci Tampilan Kapsul Asli & Menghapus Biru OS) -->
<style>
  .pill-select {
    position: relative !important;
  }

  /* Menu Dropdown Melayang Kustom */
  .custom-select-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 240px;
    background-color: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.12), 0 8px 10px -6px rgba(0,0,0,0.08);
    padding: 6px;
    z-index: 999;
    display: none;
    max-height: 280px;
    overflow-y: auto;
  }

  .custom-select-menu.show {
    display: block !important;
  }

  .custom-select-item {
    padding: 10px 14px;
    font-size: 14px;
    color: #1e293b;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-weight: 500;
  }

  /* Hover & Active Murni Warna Olive (#2b3022) Tanpa Biru OS */
  .custom-select-item:hover,
  .custom-select-item.is-selected {
    background-color: #2b3022 !important;
    color: #ffffff !important;
  }
</style>

<!-- 1. Toolbar (Di Luar Card Putih) -->
<div class="toolbar-outer" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; width: 100%;">
  <div style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;">
    
    <!-- Filter Dropdown Event (Struktur Native Asli) -->
    <label class="pill-select" style="flex-shrink: 0; margin: 0;">
      <span class="sr-only">Event</span>
      <select id="psEvent">
        <option value="">Semua event</option>
      </select>
      <svg class="icon" aria-hidden="true"><use href="#i-chev"/></svg>
    </label>

    <!-- Filter Dropdown Status (Struktur Native Asli) -->
    <label class="pill-select" style="flex-shrink: 0; margin: 0;">
      <span class="sr-only">Status</span>
      <select id="psStatus">
        <option value="">Semua status</option>
        <option value="hadir">Hadir</option>
        <option value="terdaftar">Terdaftar</option>
      </select>
      <svg class="icon" aria-hidden="true"><use href="#i-chev"/></svg>
    </label>

    <!-- Input Cari Peserta (Putih & Memanjang) -->
    <label class="search" style="margin: 0 !important; flex: 1 !important; width: 100% !important; max-width: none !important; display: flex !important; align-items: center !important; background-color: #ffffff !important; border-radius: 9999px; padding: 0 16px;">
      <svg class="icon" aria-hidden="true" style="flex-shrink: 0;">
        <use href="#i-search"/>
      </svg>
      <span class="sr-only">Cari peserta</span>
      <input
        id="psSearch"
        type="search"
        placeholder="Cari nama atau email..."
        style="width: 100% !important; flex: 1 !important; max-width: none !important; background-color: #ffffff !important; background: #ffffff !important;"
      >
    </label>
  </div>

  <div style="flex-shrink: 0;">
    <!-- Tombol Unduh CSV -->
    <button type="button" class="btn btn--ghost" id="psCsv" style="white-space: nowrap;">
      <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg> Unduh CSV
    </button>
  </div>
</div>

<!-- 2. Card Putih Utama untuk Tabel -->
<div class="card" style="background-color: #ffffff !important; padding: 0 !important; border-radius: 16px; overflow: hidden;">
  <style>
    /* Styling Header Tabel: Full Kiri-Kanan & Rata Tengah */
    .table-wrap.card-inner .tbl thead th {
      background-color: var(--olive, #2b3022) !important;
      color: #ffffff !important;
      font-weight: 700 !important;
      font-size: 13px !important;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 16px 12px !important;
      text-align: center !important;
      border: none !important;
    }

    /* Isi Sel Tabel Rata Tengah */
    .table-wrap.card-inner .tbl tbody td {
      background-color: #ffffff !important;
      text-align: center !important;
      vertical-align: middle !important;
      padding: 16px 12px !important;
      border-bottom: 1px solid #f1f5f9 !important;
    }

    /* Kolom Kedua (Nama & Email Peserta) Dibuat Rata Kiri */
    .table-wrap.card-inner .tbl tbody td:nth-child(2) {
      text-align: left !important;
      padding-left: 16px !important;
    }

    /* Matikan Hover & Zebra Striping */
    .table-wrap.card-inner .tbl tr:nth-child(even),
    .table-wrap.card-inner .tbl tr:nth-child(odd),
    .table-wrap.card-inner .tbl tr:hover {
      background-color: #ffffff !important;
      background: #ffffff !important;
    }
  </style>

  <!-- Tabel Peserta -->
  <div class="table-wrap card-inner" style="margin: 0; padding: 0;">
    <table class="tbl" style="width: 100%; margin: 0;">
      <thead>
        <tr>
          <th style="width: 60px;">No</th>
          <th>Peserta</th>
          <th>Event</th>
          <th>Terdaftar</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="psBody"></tbody>
    </table>
  </div>
</div>

<!-- Pager Navigasi Halaman -->
<div class="pager" style="margin-top: 20px;">
  <span id="psInfo"></span>
  <span id="psPage"></span>
  <button type="button" class="btn btn--ghost" id="psPrev">Sebelumnya</button>
  <button type="button" class="btn btn--ghost" id="psNext">Berikutnya</button>
</div>

<!-- Script Enhancer Dropdown (Mencegah Menu Native OS Muncul) -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    function attachCustomMenu(select) {
      if (!select) return;

      const parent = select.closest(".pill-select");
      if (!parent) return;

      // Buat container menu custom
      let menu = parent.querySelector(".custom-select-menu");
      if (!menu) {
        menu = document.createElement("div");
        menu.className = "custom-select-menu";
        parent.appendChild(menu);
      }

      function renderItems() {
        menu.innerHTML = "";
        Array.from(select.options).forEach(opt => {
          const item = document.createElement("div");
          item.className = "custom-select-item" + (opt.selected ? " is-selected" : "");
          item.textContent = opt.textContent;

          item.addEventListener("mousedown", function (e) {
            e.preventDefault();
            e.stopPropagation();
            select.value = opt.value;
            select.dispatchEvent(new Event("input", { bubbles: true }));
            select.dispatchEvent(new Event("change", { bubbles: true }));
            menu.classList.remove("show");
            renderItems();
          });

          menu.appendChild(item);
        });
      }

      // Cegah menu bawaan OS muncul saat klik
      select.addEventListener("mousedown", function (e) {
        e.preventDefault();
        document.querySelectorAll(".custom-select-menu").forEach(m => {
          if (m !== menu) m.classList.remove("show");
        });
        renderItems();
        menu.classList.toggle("show");
      });

      const observer = new MutationObserver(renderItems);
      observer.observe(select, { childList: true, subtree: true });
    }

    attachCustomMenu(document.getElementById("psEvent"));
    attachCustomMenu(document.getElementById("psStatus"));

    document.addEventListener("mousedown", function (e) {
      if (!e.target.closest(".pill-select")) {
        document.querySelectorAll(".custom-select-menu").forEach(m => m.classList.remove("show"));
      }
    });
  });
</script>
{% endblock %}
